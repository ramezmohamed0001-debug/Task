<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خطة بكرة</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Cairo', 'sans-serif'],
                    },
                    colors: {
                        luxury: {
                            black: '#050505',
                            gold: '#d4af37',
                            goldLight: '#f3e5ab',
                            border: 'rgba(212, 175, 55, 0.3)',
                            text: '#e5e5e5',
                            muted: '#999999'
                        }
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts: Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body {
            font-family: 'Cairo', sans-serif;
            color: #e5e5e5;
            background-color: #050505;
            overflow-x: hidden;
        }

        /* Fullscreen Video Background */
        .bg-video {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -2;
            object-fit: cover;
            filter: grayscale(30%);
        }

        /* Dark Overlay */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(5,5,5,0.85) 0%, rgba(5,5,5,0.95) 100%);
            z-index: -1;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(212, 175, 55, 0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #d4af37; }

        /* Glassmorphism Container */
        .glass-panel {
            background: rgba(15, 15, 15, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(212, 175, 55, 0.15);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
        }

        /* Custom Checkbox */
        .task-checkbox {
            appearance: none;
            width: 22px;
            height: 22px;
            border: 2px solid rgba(212, 175, 55, 0.4);
            border-radius: 6px;
            display: grid;
            place-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            flex-shrink: 0;
            background: rgba(0,0,0,0.3);
        }
        .task-checkbox::before {
            content: "\f00c"; 
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            font-size: 11px;
            color: #050505;
            transform: scale(0);
            transition: 0.3s transform cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .task-checkbox:checked {
            border-color: #d4af37;
            background-color: #d4af37;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }
        .task-checkbox:checked::before {
            transform: scale(1);
        }

        /* Task Item Styles */
        .task-item {
            transition: all 0.3s ease;
            animation: fadeInDown 0.4s ease-out forwards;
        }
        .task-item.completed span.task-text {
            text-decoration: line-through;
            color: #777;
        }
        .task-item.removing {
            opacity: 0;
            transform: translateX(-30px);
            pointer-events: none;
        }

        /* Gold Gradient Text */
        .text-gold-gradient {
            background: linear-gradient(to left, #d4af37, #f3e5ab, #d4af37);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 4s linear infinite;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Toast Notification */
        #toast-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            opacity: 0;
            background: linear-gradient(90deg, rgba(212,175,55,0.1), rgba(0,0,0,0.8), rgba(212,175,55,0.1));
            border: 1px solid #d4af37;
            color: #f3e5ab;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 15px;
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.2);
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(10px);
        }
        #toast-container.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        
        input::placeholder { color: rgba(255,255,255,0.3); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 selection:bg-luxury-gold selection:text-black">

    <!-- Video Background -->
    <video autoplay loop muted playsinline class="bg-video">
        <source src="https://assets.mixkit.co/videos/preview/mixkit-digital-animation-of-screens-with-code-31910-large.mp4" type="video/mp4">
    </video>
    
    <!-- Dark Overlay -->
    <div class="bg-overlay"></div>

    <main class="w-full max-w-xl z-10">
        <!-- Header -->
        <header class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl glass-panel mb-5 shadow-[0_0_20px_rgba(212,175,55,0.15)] transform rotate-45 transition-transform hover:rotate-180 duration-700">
                <i class="fa-solid fa-check-double text-2xl text-luxury-gold -rotate-45"></i>
            </div>
            <h1 class="text-4xl font-bold text-gold-gradient mb-2 tracking-wide">خطة بكرة</h1>
        </header>

        <!-- Main Glass Panel -->
        <div class="glass-panel rounded-3xl p-6 relative overflow-hidden">
            <!-- Decorative Glow Line -->
            <div class="absolute top-0 left-0 w-full h-[2px] bg-gradient-to-r from-transparent via-luxury-gold to-transparent opacity-50"></div>

            <!-- Input Form -->
            <form id="task-form" class="relative flex items-center mb-8">
                <input 
                    type="text" 
                    id="task-input" 
                    placeholder="إيه المهام اللي وراك؟..." 
                    class="w-full bg-black/40 border border-luxury-border rounded-xl py-4 pr-5 pl-14 text-luxury-text focus:outline-none focus:border-luxury-gold focus:shadow-[0_0_15px_rgba(212,175,55,0.2)] transition-all placeholder:text-sm font-medium"
                    autocomplete="off"
                    required
                >
                <button 
                    type="submit" 
                    class="absolute left-2 w-10 h-10 flex items-center justify-center bg-luxury-gold/10 text-luxury-gold hover:bg-luxury-gold hover:text-black hover:shadow-[0_0_15px_rgba(212,175,55,0.4)] border border-transparent hover:border-luxury-gold transition-all rounded-lg active:scale-95"
                    title="إضافة المهمة">
                    <i class="fa-solid fa-plus text-lg"></i>
                </button>
            </form>

            <!-- Tasks List -->
            <div class="min-h-[250px] max-h-[45vh] overflow-y-auto pr-2" id="tasks-container">
                <ul id="tasks-list" class="space-y-3">
                    <!-- Tasks injected by JS -->
                </ul>
                
                <!-- Empty State -->
                <div id="empty-state" class="hidden flex-col items-center justify-center text-center py-12 opacity-50">
                    <i class="fa-solid fa-layer-group text-4xl text-luxury-gold mb-4"></i>
                    <p class="text-luxury-text text-sm">مفيش مهام متسجلة لسه.<br>ابدأ ضيف أول خطوة.</p>
                </div>
            </div>

            <!-- Footer Stats & Actions -->
            <div class="mt-6 pt-5 border-t border-luxury-border/50 flex justify-between items-center">
                <span id="tasks-counter" class="text-luxury-muted text-sm font-light">
                    0 مهام متبقية
                </span>
                
                <button id="clear-completed-btn" class="text-xs text-red-400 hover:text-red-300 transition-colors hidden items-center gap-2 bg-red-500/10 px-3 py-1.5 rounded-lg border border-red-500/20 hover:border-red-500/50">
                    <i class="fa-solid fa-trash-can"></i>
                    مسح المهام المنجزة
                </button>
            </div>
        </div>
    </main>

    <!-- Toast Notification Element -->
    <div id="toast-container">
        <i class="fa-solid fa-trophy text-luxury-gold"></i>
        <span id="toast-message">عاش يا بطل! كمل طريقك 🚀</span>
    </div>

    <!-- JavaScript Logic -->
    <script>
        const STORAGE_KEY = 'tomorrow_tasks_app';
        
        // DOM Elements
        const taskForm = document.getElementById('task-form');
        const taskInput = document.getElementById('task-input');
        const tasksList = document.getElementById('tasks-list');
        const emptyState = document.getElementById('empty-state');
        const tasksCounter = document.getElementById('tasks-counter');
        const clearBtn = document.getElementById('clear-completed-btn');
        const toastContainer = document.getElementById('toast-container');
        const toastMessage = document.getElementById('toast-message');

        // State
        let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        let toastTimeout;

        // Save to LocalStorage
        function saveTasks() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
            updateUI();
        }

        // Render Tasks to DOM
        function renderTasks() {
            tasksList.innerHTML = '';
            
            if (tasks.length === 0) {
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
            } else {
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');
                
                tasks.forEach(task => {
                    const li = document.createElement('li');
                    li.className = `task-item group flex items-center justify-between bg-black/40 border ${task.completed ? 'border-luxury-gold/20 bg-luxury-gold/5' : 'border-luxury-border/30 hover:border-luxury-gold/40'} rounded-xl p-4 transition-all duration-300 ${task.completed ? 'completed' : ''}`;
                    li.id = `task-${task.id}`;
                    
                    li.innerHTML = `
                        <div class="flex items-center gap-4 flex-1 cursor-pointer" onclick="toggleTask(${task.id})">
                            <input type="checkbox" class="task-checkbox pointer-events-none" ${task.completed ? 'checked' : ''}>
                            <span class="task-text text-base font-medium transition-colors select-none line-clamp-2">${escapeHTML(task.text)}</span>
                        </div>
                        <button onclick="deleteTask(${task.id})" class="w-8 h-8 flex items-center justify-center text-luxury-muted hover:text-red-400 hover:bg-red-400/10 rounded-lg transition-all opacity-0 group-hover:opacity-100 focus:opacity-100 mr-2" title="حذف">
                            <i class="fa-solid fa-xmark text-lg"></i>
                        </button>
                    `;
                    tasksList.appendChild(li);
                });
            }
            updateUI();
        }

        // Update Counter and Buttons
        function updateUI() {
            const activeTasks = tasks.filter(t => !t.completed).length;
            const completedTasks = tasks.filter(t => t.completed).length;
            
            tasksCounter.innerHTML = `<span class="${activeTasks > 0 ? 'text-luxury-gold font-bold' : 'text-luxury-muted'}">${activeTasks}</span> مهام متبقية`;
            
            if (completedTasks > 0) {
                clearBtn.classList.remove('hidden');
                clearBtn.classList.add('flex');
            } else {
                clearBtn.classList.add('hidden');
                clearBtn.classList.remove('flex');
            }
        }

        // Show Toast Notification
        function showToast(msg) {
            toastMessage.innerText = msg;
            toastContainer.classList.add('show');
            
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toastContainer.classList.remove('show');
            }, 3000);
        }

        // Trigger Confetti
        function fireConfetti() {
            const duration = 2000;
            const end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#d4af37', '#f3e5ab', '#ffffff']
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#d4af37', '#f3e5ab', '#ffffff']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }

        // Add Task
        taskForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = taskInput.value.trim();
            if (text) {
                const newTask = {
                    id: Date.now(),
                    text: text,
                    completed: false
                };
                tasks.unshift(newTask); // Add to top
                taskInput.value = '';
                saveTasks();
                renderTasks();
            }
        });

        // Toggle Complete
        window.toggleTask = (id) => {
            const taskIndex = tasks.findIndex(t => t.id === id);
            if (taskIndex === -1) return;

            const wasCompleted = tasks[taskIndex].completed;
            tasks[taskIndex].completed = !wasCompleted;
            
            saveTasks();
            renderTasks();

            // Trigger celebrations only if it's changing FROM incomplete TO complete
            if (!wasCompleted) {
                fireConfetti();
                showToast("عاش يا بطل! كمل طريقك 🚀");
            }
        };

        // Delete Task (with animation)
        window.deleteTask = (id) => {
            const li = document.getElementById(`task-${id}`);
            if (li) {
                li.classList.add('removing');
                setTimeout(() => {
                    tasks = tasks.filter(task => task.id !== id);
                    saveTasks();
                    renderTasks();
                }, 300);
            }
        };

        // Clear All Completed
        clearBtn.addEventListener('click', () => {
            const completedIds = tasks.filter(t => t.completed).map(t => t.id);
            
            completedIds.forEach(id => {
                const li = document.getElementById(`task-${id}`);
                if (li) li.classList.add('removing');
            });

            setTimeout(() => {
                tasks = tasks.filter(task => !task.completed);
                saveTasks();
                renderTasks();
            }, 300);
        });

        // Helper: Prevent HTML Injection
        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // Initial Render
        renderTasks();
    </script>
</body>
</html>
